spring.application.name=expense-tracker
app.version=${APP_VERSION:development}
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:change-this-local-development-secret-at-least-256-bits}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Inactivity Session Timeout (30 minutes)
app.session.inactivity-timeout-ms=${VITE_INACTIVITY_TIMEOUT_MS:1800000}
app.quote-of-day.url=${QUOTE_OF_DAY_URL:https://zenquotes.io/api/today}

# Platform Administration (set temporarily to an existing user's mobile, then remove after bootstrap)
app.system-admin.bootstrap-mobile=${SYSTEM_ADMIN_BOOTSTRAP_MOBILE:}

# File Upload Configuration
app.file.upload.dir=${APP_FILE_UPLOAD_DIR:./uploads}
app.file.allowed-extensions=${APP_FILE_ALLOWED_EXTENSIONS:jpg,jpeg,jfif,png,pdf}
app.file.max-size=${APP_FILE_MAX_SIZE:5242880}
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:}
app.supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY:}
app.supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY:}
app.supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
app.supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:}

# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}
server.error.include-message=always
server.error.include-binding-errors=always

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.app=${LOGGING_LEVEL_COM_APP:DEBUG}

server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:120000}
system.admin.bootstrap-mobile=${SYSTEM_ADMIN_BOOTSTRAP_MOBILE:}
